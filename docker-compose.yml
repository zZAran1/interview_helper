services:
  # MySQL 数据库：不对外暴露端口，只允许容器间访问（安全）
  db:
    image: mysql:8.0
    container_name: interview-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: interview_helper
    volumes:
      # 数据持久化：容器删除数据不丢
      - db-data:/var/lib/mysql
      # 首次启动自动执行建表脚本
      - ./interview_helper_backend/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Python AI 服务
  ai:
    build: ./interview_helper_ai
    container_name: interview-ai
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_API_BASE: ${OPENAI_API_BASE}

  # Java 后端
  backend:
    build: ./interview_helper_backend
    container_name: interview-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy   # 等数据库就绪才启动，避免连不上
      ai:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://db:3306/interview_helper?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AI_SERVICE_URL: http://ai:8000
      CORS_ALLOWED_ORIGINS: http://localhost

  # 前端 + Nginx：唯一对外的 80 端口
  frontend:
    build: ./interview_helper_frontend
    container_name: interview-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db-data: