spring:
  datasource:
    url: jdbc:mysql://localhost:3306/interview_helper?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: root
    password: '123456'
    driver-class-name: com.mysql.cj.jdbc.Driver
  cache:
     type: redis # 指定缓存类型为Redis
  data:
    redis:
      host: localhost # Redis服务器地址
      port: 6379      # Redis服务器端口
      password: 123456      # 如有密码请填写
      database: 0     # 使用的数据库索引
      timeout: 3000ms # 连接超时时间
      lettuce:
        pool:
          max-active: 8   # 连接池最大连接数
          max-idle: 1     # 连接池最大空闲连接数
          min-idle: 0     # 连接池最小空闲连接数
          max-wait: 3000
  ai:
    deepseek:
      api-key: "YOUR_API_KEY_HERE"
      base-url: https://api.deepseek.com

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: false
  global-config:
    db-config:
      id-type: AUTO

